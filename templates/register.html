<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register — Secure Compiler</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Create Account</h1>
      <p class="text-xs text-slate-500 mt-1">Register new authorized analyst</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 p-3 text-xs rounded border {% if category == 'error' %}bg-red-50 border-red-200 text-red-700{% else %}bg-emerald-50 border-emerald-200 text-emerald-800{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/register" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
        <input type="text" name="username" required class="w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:border-emerald-600">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
        <input type="password" name="password" required class="w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:border-emerald-600">
      </div>
      <button type="submit" class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white rounded font-medium text-sm transition">
        Register Account
      </button>
    </form>

    <div class="mt-4 text-center">
      <a href="/login" class="text-xs text-slate-500 hover:text-emerald-600">Already have an account? Sign in</a>
    </div>
  </div>
</body>
</html>
